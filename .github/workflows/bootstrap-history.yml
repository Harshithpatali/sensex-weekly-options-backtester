name: Bootstrap SENSEX historical dataset

on:
  push:
    paths:
      - ".github/bootstrap-history.trigger"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Historical start date (YYYY-MM-DD)"
        required: true
        default: "2023-05-15"
      end_date:
        description: "Historical end date (YYYY-MM-DD)"
        required: true
        default: "2026-11-06"

permissions:
  contents: write

concurrency:
  group: sensex-data-pipeline
  cancel-in-progress: false

jobs:
  download-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download historical SENSEX index and BSE options
        env:
          START_DATE: ${{ github.event.inputs.start_date || '2023-05-15' }}
          END_DATE: ${{ github.event.inputs.end_date || '2024-07-05' }}
        run: |
          python - <<'PY'
          import os
          from sensex_options.config import DEFAULT_PATHS
          import pandas as pd
          from sensex_options.sources.index import download_sensex_index, load_index
          from sensex_options.sources.bse import download_bse_options_range
          DEFAULT_PATHS.ensure()
          backfill_index = download_sensex_index(
              os.environ["START_DATE"], os.environ["END_DATE"],
              processed_path=DEFAULT_PATHS.processed / "index_backfill.csv",
          )
          # Preserve the already accumulated post-backfill index history.
          current_index = load_index()
          combined_index = pd.concat([current_index, backfill_index], ignore_index=True)
          combined_index["date"] = pd.to_datetime(combined_index["date"], errors="coerce").dt.normalize()
          combined_index = combined_index.dropna(subset=["date"]).drop_duplicates("date", keep="last")
          combined_index.sort_values("date").to_csv(
              DEFAULT_PATHS.processed / "sensex_index.csv", index=False
          )
          download_bse_options_range(os.environ["START_DATE"], os.environ["END_DATE"], sleep=0.5)
          PY
      - name: Validate and generate strategy leaderboard
        run: python -m sensex_options.daily_pipeline
      - name: Persist dataset and research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The pipeline can update additional tracked reports alongside the primary files.
          # Stage all generated research data/reports and any other tracked pipeline changes
          # so rebase always starts from a clean working tree.
          git add -f -A data/processed outputs data/reports
          git add -u
          git diff --cached --quiet || git commit -m "data: bootstrap historical SENSEX options research dataset"
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean after committing generated research outputs:"
            git status --short
            exit 1
          fi
          # Retry if main advances between fetch/rebase and push. Never force-push:
          # each attempt first integrates the latest remote commit.
          for attempt in 1 2 3 4 5; do
            echo "Safe push attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase conflict while integrating origin/main; refusing to overwrite remote history."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Successfully pushed research outputs to main."
              exit 0
            fi
            echo "Remote main moved during push; retrying after a short delay."
            sleep $((attempt * 3))
          done
          echo "::error::Could not push after five safe retries."
          exit 1
