name: Daily SENSEX data and strategy research

on:
  push:
    paths:
      - ".github/daily-research.trigger"
  schedule:
    # 06:30 Asia/Kolkata = 01:00 UTC, weekdays
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sensex-data-pipeline
  cancel-in-progress: false

jobs:
  collect-train-test-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Collect latest data, validate, replay strategy suite and rank
        run: python -m sensex_options.daily_pipeline
      - name: Persist processed history and daily outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage every generated dataset/report so the rebase starts clean.
          git add -f -A data/processed outputs data/reports
          git add -u
          git diff --cached --quiet || git commit -m "chore: daily SENSEX data and strategy refresh"
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean after staging generated research outputs:"
            git status --short
            exit 1
          fi
          # Retry if main advances between fetch/rebase and push. Never force-push:
          # each attempt first integrates the latest remote commit.
          for attempt in 1 2 3 4 5; do
            echo "Safe push attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase conflict while integrating origin/main; refusing to overwrite remote history."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Successfully pushed research outputs to main."
              exit 0
            fi
            echo "Remote main moved during push; retrying after a short delay."
            sleep $((attempt * 3))
          done
          echo "::error::Could not push after five safe retries."
          exit 1
