name: Daily SENSEX data and strategy research

on:
  push:
    paths:
      - ".github/daily-research.trigger"
  schedule:
    # 06:30 Asia/Kolkata = 01:00 UTC, weekdays
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sensex-data-pipeline
  cancel-in-progress: false

jobs:
  collect-train-test-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Collect latest data, validate, replay strategy suite and rank
        run: python -m sensex_options.daily_pipeline
      - name: Persist processed history and daily outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/sensex_index.csv data/processed/sensex_options.csv.gz outputs/strategy_trade_ledger.csv outputs/strategy_leaderboard.csv outputs/strategy_performance_metrics.csv outputs/walk_forward_report.json outputs/daily_strategy_pnl.csv outputs/weekly_strategy_pnl.csv outputs/monthly_strategy_pnl.csv outputs/daily_run.json data/reports/data_validation.json
          git diff --cached --quiet || git commit -m "chore: daily SENSEX data and strategy refresh"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
